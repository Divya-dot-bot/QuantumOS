[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "quantumos"
version = "0.1.0"
description = "An experimental operating environment for managing and executing quantum workloads."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "QuantumOS Contributors" }
]
dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "."
]


[tool.setuptools.packages.find]
include = [
    "qos*"
]